server.port=8080
spring.application.name=kafka-streams
spring.kafka.bootstrap-servers=localhost:9094
#logging.level.org.apache.kafka.clients.admin.internals=WARN
#logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.apache.kafka.clients=DEBUG
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
#spring.kafka.streams.auto-startup=false
#spring.kafka.admin.auto-create=false
spring.kafka.streams.properties.default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
spring.kafka.streams.properties.default.production.exception.handler=org.apache.kafka.streams.errors.LogAndFailExceptionHandler
