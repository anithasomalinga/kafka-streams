services:
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"   # For Spring Boot
      - "9094:9094"   # For Conduktor
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      # 1. Map three security protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,LOCAL_APP:PLAINTEXT,CONDUKTOR_APP:PLAINTEXT,CONTROLLER:PLAINTEXT

      # 2. Open ports 9092 (Spring Boot) and 9094 (Conduktor) inside the container
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,LOCAL_APP://0.0.0.0:9092,CONDUKTOR_APP://0.0.0.0:9094

      # 3. Tell each app exactly how to route back to Kafka
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,LOCAL_APP://localhost:9092,CONDUKTOR_APP://host.docker.internal:9094

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
